name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref rather than paying for both.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Backend: lint, test, and prove the migrations apply to a real Postgres.
  #
  # The pytest suite needs neither of these services: backend/tests/conftest.py
  # sets its own environment before any app module is imported and runs against
  # a throwaway SQLite file with REDIS_URL blank. The services are here for the
  # last step, which runs `alembic upgrade head` against postgres:16 so a broken
  # or missing migration fails CI instead of failing a deploy.
  # ---------------------------------------------------------------------------
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobagent
          POSTGRES_PASSWORD: jobagent
          POSTGRES_DB: jobagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobagent -d jobagent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest + coverage)
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Migrations apply to Postgres
        env:
          DATABASE_URL: postgresql+psycopg://jobagent:jobagent@localhost:5432/jobagent
        run: alembic upgrade head

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Frontend: types must be sound and the production build must succeed.
  # ---------------------------------------------------------------------------
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        # `npm ci` needs a lockfile; fall back until one is committed.
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Build-time only. Nothing secret is ever inlined into the bundle.
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
        run: npm run build

  # ---------------------------------------------------------------------------
  # Browser assistant. In production it runs HEADED on the user's own machine so a
  # human can watch it; config.ts refuses HEADLESS=true there. CI is different: no
  # human, no employer site, only local fixture pages, so Chromium is installed and
  # the live-DOM guard tests run headless. Those are the only tests that prove
  # detectHardStops actually finds a challenge widget in a real document rather
  # than in a string.
  # ---------------------------------------------------------------------------
  assistant:
    name: assistant
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: browser-assistant

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Install Chromium for the live-DOM guard tests
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
