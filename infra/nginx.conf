# =============================================================================
#  Example nginx reverse proxy for a single-host deploy.
#
#  Layout:
#     browser --HTTPS--> nginx --HTTP--> web:3000   (Next.js, everything else)
#                              \--HTTP--> api:8000   (FastAPI, /api/)
#
#  Both upstreams stay on the private docker network. Only nginx is published.
#
#  ---------------------------------------------------------------------------
#  DO NOT EXPOSE THIS APP WITHOUT TLS.
#  ---------------------------------------------------------------------------
#  In staging and production the session cookies are issued with the Secure
#  flag, so a browser will refuse to send them over plain HTTP and sign-in will
#  silently never work. More importantly, those cookies are the whole session:
#  over HTTP anyone on the path can read them, and with them read and write a
#  person's entire job search. There is no "just for a minute" version of this.
#  Terminate TLS here, redirect every port 80 request to HTTPS, and keep it on.
#
#  This file is an example. Copy it, set your own server_name and certificate
#  paths, and run `nginx -t` before reloading.
# =============================================================================

# Upstreams. With docker compose these resolve on the compose network; on a
# plain systemd host use 127.0.0.1:8000 and 127.0.0.1:3000 instead.
upstream jobagent_api {
    server api:8000;
    keepalive 16;
}

upstream jobagent_web {
    server web:3000;
    keepalive 16;
}

# --- port 80: redirect only --------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name jobagent.example.com;

    # Leave this location so an ACME client (certbot and friends) can renew.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- port 443: the application ----------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jobagent.example.com;

    # --- TLS termination ---
    ssl_certificate     /etc/letsencrypt/live/jobagent.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobagent.example.com/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # OCSP stapling. Needs ssl_trusted_certificate (chain.pem) to be set.
    ssl_stapling        on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/jobagent.example.com/chain.pem;

    # --- HSTS ---
    # Tells browsers to never touch this host over plain HTTP again. Only turn
    # on preload once you are certain every subdomain will serve HTTPS forever:
    # getting off the preload list takes months.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The Next.js app already sets X-Frame-Options, X-Content-Type-Options,
    # Referrer-Policy, Permissions-Policy and a CSP (see frontend/next.config.mjs).
    # Repeating them here would produce duplicate headers, so it does not.

    # --- request limits ---
    # 16m covers a resume or portfolio PDF upload with room to spare. Raise it
    # only if you also raise the matching limit on the API side.
    client_max_body_size 16m;
    client_body_timeout  60s;
    client_header_timeout 60s;

    # --- proxy defaults ---
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";

    # Generous but bounded. Document generation and a discovery sweep kicked off
    # from the UI can take a while; nothing legitimate should take five minutes.
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;
    proxy_buffering       on;
    proxy_buffer_size     16k;
    proxy_buffers         8 16k;

    # --- API ---
    location /api/ {
        proxy_pass http://jobagent_api;

        # Server-sent events and long-poll endpoints must not be buffered.
        proxy_set_header X-Accel-Buffering no;
    }

    # The API's own health endpoint sits at the root, not under /api/.
    # Keep it off the public internet if you can; it names your dependencies.
    location = /health {
        proxy_pass http://jobagent_api/health;
        access_log off;
        # allow 10.0.0.0/8;
        # deny  all;
    }

    # --- everything else: the Next.js app ---
    location / {
        proxy_pass http://jobagent_web;
    }

    # Immutable build assets. Safe to cache hard because the filename changes
    # whenever the content does.
    location /_next/static/ {
        proxy_pass http://jobagent_web;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
